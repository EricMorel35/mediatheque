tmdb.api.url=http://api.themoviedb.org
tmdb.api.search=/3/search/movie
tmdb.api.movie=/3/movie/
# Never hardcode the real key here: it would end up versioned in git
# history forever, even after being removed later. Set it via the
# TMDB_API_KEY environment variable instead.
tmdb.api_key=${TMDB_API_KEY:}
urlCover=http://cf2.imgobject.com/t/p/w500
urlYoutube=http://www.youtube.com/watch?v=
tmdb.search.query=http://api.themoviedb.org/3/search/movie?api_key={key}&query={query}&language={language}
tmdb.movie.query=http://api.themoviedb.org/3/movie/{movie}?api_key=${tmdb.api_key}&language=fr&append_to_response=casts,trailers
