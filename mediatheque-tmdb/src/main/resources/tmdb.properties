tmdb.api.url=http://api.themoviedb.org
tmdb.api.search=/3/search/movie
tmdb.api.movie=/3/movie/
# TMDB v4 Read Access Token (Bearer auth), not the v3 api_key -- sent as
# an Authorization header by AppTMDBConfiguration's RestTemplate
# interceptor, not embedded in the URLs below. Never hardcode the real
# value here: it would end up versioned in git history forever, even
# after being removed later. Set it via the TMDB_API_KEY environment
# variable instead.
tmdb.api_key=${TMDB_API_KEY:}
# cf2.imgobject.com was TMDB's image CDN hostname years ago; it no
# longer resolves in DNS at all. Current base per GET /3/configuration
# (images.secure_base_url) is image.tmdb.org.
urlCover=https://image.tmdb.org/t/p/w500
urlYoutube=http://www.youtube.com/watch?v=
tmdb.search.query=http://api.themoviedb.org/3/search/movie?query={query}&language={language}
tmdb.movie.query=http://api.themoviedb.org/3/movie/{movie}?language=fr&append_to_response=casts,trailers
