###
#   Database Settings
###
# MySQL started via docker-compose.yml (docker compose up -d). Credentials
# are local-dev-only defaults, see docker-compose.yml.
spring.datasource.url=jdbc:mysql://localhost:3306/mediatheque?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=mediatheque
spring.datasource.password=mediatheque
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

###
#   Hibernate Settings
###
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.format_sql=false